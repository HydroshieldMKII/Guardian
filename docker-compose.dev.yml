services:
  guardian:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: guardian
    ports:
      - "3000:3000"
    volumes:
      - ./data:/app/data
    environment:
      - TRUST_PROXY_HOPS=1
      # - APP_URL=https://guardian.example.com # For password reset by email
    restart: unless-stopped
