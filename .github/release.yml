changelog:
  exclude:
    labels: [skip-changelog]
  categories:
    - title: New Features
      labels: [feature]
    - title: Improvements
      labels: [enhancement]
    - title: Bug Fixes
      labels: [bug]
    - title: Security
      labels: [security]
    - title: Dependencies
      labels: [dependencies]
    - title: Other Changes
      labels: ['*']
