name: CI

on:
  workflow_dispatch:
  workflow_call:
    inputs:
      full:
        type: boolean
        default: true
  pull_request:
    branches: [main]
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  pull-requests: read

jobs:
  changes:
    runs-on: ubuntu-latest
    outputs:
      backend: ${{ steps.filter.outputs.backend }}
      frontend: ${{ steps.filter.outputs.frontend }}
      image: ${{ steps.filter.outputs.image }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - id: filter
        if: ${{ !inputs.full }}
        uses: dorny/paths-filter@ceb8a2b8f2d89434be7ff52d3de7ec3738c5cc9d # v4.0.3
        with:
          filters: |
            workflow: &workflow
              - '.github/workflows/ci.yml'
              - '.github/scripts/**'
            backend: &backend
              - *workflow
              - 'backend/**'
            frontend: &frontend
              - *workflow
              - 'frontend/**'
            image:
              - *backend
              - *frontend
              - 'Dockerfile'
              - '.dockerignore'
              - 'docker-entrypoint.sh'

  backend:
    needs: changes
    if: needs.changes.outputs.backend == 'true' || github.event_name == 'workflow_dispatch' || inputs.full
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: backend/package-lock.json

      - run: npm ci

      - run: npm run lint:ci

      - run: npm run typecheck

      - run: npm run test:cov

      - run: npm run build

      - if: always()
        uses: codecov/codecov-action@303a32d7a59b442fa8d48b6a1cc6825c09c847a5 # v7.1.1
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          root_dir: ${{ github.workspace }}
          files: ${{ github.workspace }}/backend/coverage/lcov.info
          flags: backend
          name: backend
          disable_search: true
          fail_ci_if_error: false

      - if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: backend-coverage
          path: backend/coverage
          retention-days: 7

  frontend:
    needs: changes
    if: needs.changes.outputs.frontend == 'true' || github.event_name == 'workflow_dispatch' || inputs.full
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - run: npm ci

      - run: npm run lint:ci

      - run: npm run typecheck

      - run: npm run test:cov

      - run: npm run build

      - if: always()
        uses: codecov/codecov-action@303a32d7a59b442fa8d48b6a1cc6825c09c847a5 # v7.1.1
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          root_dir: ${{ github.workspace }}
          files: ${{ github.workspace }}/frontend/coverage/lcov.info
          flags: frontend
          name: frontend
          disable_search: true
          fail_ci_if_error: false

      - if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: frontend-coverage
          path: frontend/coverage
          retention-days: 7

  image:
    needs: changes
    if: needs.changes.outputs.image == 'true' || github.event_name == 'workflow_dispatch' || inputs.full
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          push: false
          load: true
          tags: guardian:${{ github.sha }}
          cache-from: type=gha,scope=guardian-linux/amd64
          cache-to: type=gha,scope=guardian-linux/amd64,mode=max

      - run: .github/scripts/smoke-test.sh guardian:${{ github.sha }}

  ci:
    if: always()
    needs: [changes, backend, frontend, image]
    runs-on: ubuntu-latest
    steps:
      - if: contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled')
        run: exit 1
