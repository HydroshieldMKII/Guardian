name: PR Dependabot auto-merge

on: pull_request

permissions:
  contents: write
  pull-requests: write

jobs:
  automerge:
    if: github.event.pull_request.user.login == 'dependabot[bot]' && github.repository == 'HydroshieldMKII/Guardian'
    runs-on: ubuntu-latest
    steps:
      - id: metadata
        uses: dependabot/fetch-metadata@25dd0e34f4fe68f24cc83900b1fe3fe149efef98 # v3.1.0

      - env:
          GH_TOKEN: ${{ github.token }}
          PR_URL: ${{ github.event.pull_request.html_url }}
          UPDATES: ${{ steps.metadata.outputs.updated-dependencies-json }}
        run: |
          printf '%s\n' "$UPDATES" | jq -r '.[] | "\(.dependencyName) \(.prevVersion) -> \(.newVersion) (\(.updateType))"'
          safe=$(printf '%s\n' "$UPDATES" | jq 'length > 0 and all(.[];
            .updateType == "version-update:semver-patch"
            or (.updateType == "version-update:semver-minor" and ((.prevVersion // "0.") | ltrimstr("v") | startswith("0.") | not))
          )')
          if [ "$safe" != true ]; then
            echo "Needs a manual review: major update or a 0.x minor update." >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          gh pr merge --auto --squash "$PR_URL"
